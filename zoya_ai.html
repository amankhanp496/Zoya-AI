<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zoya AI - Premium</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { font-family: 'Poppins', sans-serif; background: #09090b; color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; position: relative; }
        
        /* Top Header */
        .header { width: 100%; padding: 20px; display: flex; justify-content: space-between; align-items: center; font-size: 16px; font-weight: 600; z-index: 10; }
        .menu-icon, .profile-icon { font-size: 20px; color: #aaa; cursor: pointer; }
        .app-name { display: flex; align-items: center; gap: 5px; }
        .app-name span { color: #ff69b4; font-size: 20px; }

        /* Main Center Area */
        .center-area { flex: 1; width: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; padding-bottom: 80px; }

        /* Zoya Ki Image */
        .zoya-image { width: 280px; height: 280px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255, 255, 255, 0.1); box-shadow: 0 0 40px rgba(255, 105, 180, 0.3); transition: all 0.4s ease; position: absolute; opacity: 1; transform: scale(1); }

        /* Listening Animation Container */
        .listening-container { display: flex; flex-direction: column; align-items: center; justify-content: center; position: absolute; opacity: 0; transform: scale(0.8); transition: all 0.4s ease; pointer-events: none; }
        .wave-container { display: flex; justify-content: center; align-items: center; height: 100px; gap: 6px; }
        
        .bar { width: 10px; height: 20px; background: linear-gradient(to top, #ff69b4, #8a2be2); border-radius: 5px; animation: waveAnim 1.2s infinite ease-in-out; }
        .bar:nth-child(1) { animation-delay: 0.0s; } .bar:nth-child(2) { animation-delay: 0.2s; } .bar:nth-child(3) { animation-delay: 0.4s; } .bar:nth-child(4) { animation-delay: 0.2s; } .bar:nth-child(5) { animation-delay: 0.0s; } .bar:nth-child(6) { animation-delay: 0.3s; } .bar:nth-child(7) { animation-delay: 0.1s; }

        @keyframes waveAnim { 0%, 100% { height: 20px; opacity: 0.5; box-shadow: none; } 50% { height: 70px; opacity: 1; box-shadow: 0 0 20px #ff69b4; } }
        .listening-text { margin-top: 20px; font-size: 16px; color: #aaa; letter-spacing: 1px; }

        .center-area.listening .zoya-image { opacity: 0; transform: scale(0.8); }
        .center-area.listening .listening-container { opacity: 1; transform: scale(1); }

        /* Chat Messages Area (Thoda Upar) */
        .messages-container { position: absolute; bottom: 100px; width: 95%; max-width: 400px; max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px; scrollbar-width: none; z-index: 15; }
        .messages-container::-webkit-scrollbar { display: none; }
        .msg { padding: 12px 16px; border-radius: 15px; font-size: 13px; max-width: 85%; line-height: 1.4; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .msg.user { background: linear-gradient(135deg, #ff69b4, #8a2be2); align-self: flex-end; border-bottom-right-radius: 4px; color: white; }
        .msg.zoya { background: rgba(30, 30, 40, 0.9); backdrop-filter: blur(10px); align-self: flex-start; border-bottom-left-radius: 4px; color: #e0e0e0; border: 1px solid rgba(255,255,255,0.1); }

        /* Stylish Floating Input Box */
        .input-container {
            position: absolute;
            bottom: 100px; /* Neeche se thoda upar uthaya */
            width: 92%;
            max-width: 400px;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05); /* Glass effect */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 105, 180, 0.3); /* Pink border */
            border-radius: 30px;
            padding: 8px 8px 8px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 105, 180, 0.2);
            z-index: 20;
        }

        .input-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 15px;
            outline: none;
            font-family: 'Poppins', sans-serif;
        }

        .input-container input::placeholder {
            color: #888;
        }

        /* Stylish Mic Button inside Input */
        .mic-button {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff69b4, #8a2be2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.4);
            transition: 0.3s;
            margin-left: 10px;
        }
        .mic-button.recording {
            background: #ff3366;
            box-shadow: 0 0 20px #ff3366;
            animation: pulseMic 1s infinite;
        }
        @keyframes pulseMic {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="menu-icon">☰</div>
        <div class="app-name"><span>✦</span> Zoya</div>
        <div class="profile-icon">👤</div>
    </div>

    <div class="center-area" id="centerArea">
        <img src="/static/anime.jpg" alt="Zoya" class="zoya-image">
        
        <div class="listening-container">
            <div class="wave-container">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
            <div class="listening-text">Listening...</div>
        </div>
    </div>

    <!-- Chat Messages ab image ke upar dikhenge -->
    <div class="messages-container" id="messages"></div>

    <!-- Naya Stylish Input Box -->
    <div class="input-container">
        <input type="text" id="msgInput" placeholder="Ask Zoya anything...">
        <div class="mic-button" id="micBtn">🎙️</div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const messages = document.getElementById('messages');
        const input = document.getElementById('msgInput');
        const audioPlayer = document.getElementById('audioPlayer');
        const micBtn = document.getElementById('micBtn');
        const centerArea = document.getElementById('centerArea');
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'hi-IN';
        recognition.continuous = true; 
        
        let isListening = false;
        let isProcessing = false;

        micBtn.addEventListener('click', () => {
            if (!isListening) {
                try { recognition.start(); } catch(e) {}
                isListening = true;
                micBtn.classList.add('recording');
                micBtn.innerText = "⏹️"; 
                centerArea.classList.add('listening');
            } else {
                recognition.stop();
                isListening = false;
                micBtn.classList.remove('recording');
                micBtn.innerText = "🎙️";
                centerArea.classList.remove('listening');
            }
        });

        recognition.onresult = (event) => {
            if (isProcessing) return;
            const last = event.results.length - 1;
            const text = event.results[last][0].transcript.trim();
            if (text) {
                sendMessage(text, 'mic'); 
                centerArea.classList.remove('listening'); 
            }
        };

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const text = input.value.trim();
                if(text) sendMessage(text, 'text');
            }
        });

        async function sendMessage(text, type) {
            if (!text) return;
            input.value = '';
            addMessage(text, 'user');
            isProcessing = true; 

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: text})
                });
                const data = await response.json();
                addMessage(data.reply, 'zoya');

                if(data.audio_url) {
                    audioPlayer.src = data.audio_url;
                    audioPlayer.play();
                    audioPlayer.onended = () => { isProcessing = false; };
                } else {
                    isProcessing = false;
                }
            } catch (error) {
                addMessage("Connection error.", 'zoya');
                isProcessing = false;
            }
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }
    </script>
</body>
</html>
